# Hidden-node demo, equal levels (mutual destruction).
#
# A<->B and B<->C have the same path loss. A<->C is *not* linked: A and C
# cannot hear each other, so neither knows the other is keying. When both
# transmit overlapping frames, B receives two carriers at equal level;
# neither captures its receiver, which turns out garble, and it decodes
# nothing.
#
# Compare with hidden-node-capture.yaml: same topology, asymmetric loss,
# A captures over C and its frames punch through.
nodes:
  - id: a
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
  - id: c
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

links:
  # A ↔ B
  - { from: a.vhf, to: b.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 120 }
  # B ↔ C
  - { from: b.vhf, to: c.vhf, path_loss_db: 120 }
  - { from: c.vhf, to: b.vhf, path_loss_db: 120 }
  # A and C deliberately *not* linked — they're hidden from each other.
