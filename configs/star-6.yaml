# Star topology: hub plus 5 spoke stations. Hub hears all spokes, spokes
# hear only the hub. Useful for digipeater / bulletin-board setups.
nodes:
  - { id: hub,   ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }] }
  - { id: s1,  ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }] }
  - { id: s2,  ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8003 }] }
  - { id: s3,  ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8004 }] }
  - { id: s4,  ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8005 }] }
  - { id: s5,  ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8006 }] }

links:
  - { from: hub.vhf, to: s1.vhf, path_loss_db: 120 }
  - { from: s1.vhf, to: hub.vhf, path_loss_db: 120 }
  - { from: hub.vhf, to: s2.vhf, path_loss_db: 120 }
  - { from: s2.vhf, to: hub.vhf, path_loss_db: 120 }
  - { from: hub.vhf, to: s3.vhf, path_loss_db: 120 }
  - { from: s3.vhf, to: hub.vhf, path_loss_db: 120 }
  - { from: hub.vhf, to: s4.vhf, path_loss_db: 120 }
  - { from: s4.vhf, to: hub.vhf, path_loss_db: 120 }
  - { from: hub.vhf, to: s5.vhf, path_loss_db: 120 }
  - { from: s5.vhf, to: hub.vhf, path_loss_db: 120 }
