# Linear chain of 6 AFSK1200 stations: A — B — C — D — E — F.
# Each station hears only its immediate neighbours.
nodes:
  - { id: a, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }] }
  - { id: b, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }] }
  - { id: c, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8003 }] }
  - { id: d, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8004 }] }
  - { id: e, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8005 }] }
  - { id: f, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8006 }] }

links:
  - { from: a.vhf, to: b.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: c.vhf, path_loss_db: 120 }
  - { from: c.vhf, to: b.vhf, path_loss_db: 120 }
  - { from: c.vhf, to: d.vhf, path_loss_db: 120 }
  - { from: d.vhf, to: c.vhf, path_loss_db: 120 }
  - { from: d.vhf, to: e.vhf, path_loss_db: 120 }
  - { from: e.vhf, to: d.vhf, path_loss_db: 120 }
  - { from: e.vhf, to: f.vhf, path_loss_db: 120 }
  - { from: f.vhf, to: e.vhf, path_loss_db: 120 }
