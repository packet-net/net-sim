# Three-node fully connected mesh, AFSK1200, equal loss everywhere.
# Every node hears every other.
nodes:
  - id: a
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
  - id: c
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

links:
  - { from: a.vhf, to: b.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 120 }
  - { from: a.vhf, to: c.vhf, path_loss_db: 120 }
  - { from: c.vhf, to: a.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: c.vhf, path_loss_db: 120 }
  - { from: c.vhf, to: b.vhf, path_loss_db: 120 }
