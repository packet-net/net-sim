# Two AFSK1200 stations right at the edge of range, to watch frames fail.
#
# FM doesn't fade away gracefully: above its threshold the receiver's
# output is clean, below it the discriminator collapses into clicks. With
# the default radios (25 W, a Tait TM8100 on a 12.5 kHz channel via its data
# taps, a residential site: a noise floor of about -120.8 dBm), direwolf at
# 1200 baud measured, 12 frames per point:
#
#   path_loss_db 156   12/12 frames  (carrier-to-noise about 8.8 dB)
#   path_loss_db 157    9/12
#   path_loss_db 157.5  6/12
#   path_loss_db 158    2/12
#   path_loss_db 159    0/12        (about 5.8 dB)
#
# This demo sits at 157.5, where about half get through. Move it a dB
# either way to see how steep the edge is.
nodes:
  - { id: a, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }] }
  - { id: b, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }] }

links:
  - { from: a.vhf, to: b.vhf, path_loss_db: 157.5 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 157.5 }
