# Hidden-node demo, asymmetric levels (A captures).
#
# Same topology as hidden-node.yaml (A and C cannot hear each other, both
# are heard by B) but A arrives at B 20 dB stronger than C. When both
# transmit at once, A's carrier captures B's limiter and discriminator and
# its frames decode; C is suppressed despite transmitting. Nothing in the
# simulator decides this: it is what an FM receiver does with two carriers.
#
# This is the configuration-driven proof that the FM capture effect is
# what makes packet usable on shared-channel VHF in the real world.
nodes:
  - id: a
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
  - id: c
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

links:
  # A <-> B, a strong path
  - { from: a.vhf, to: b.vhf, path_loss_db: 125 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 125 }
  # B <-> C, 20 dB weaker
  - { from: b.vhf, to: c.vhf, path_loss_db: 145 }
  - { from: c.vhf, to: b.vhf, path_loss_db: 145 }
  # A — C: hidden from each other.
