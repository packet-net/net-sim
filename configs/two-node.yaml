# Smoke-test config: two nodes, one port each, bidirectional AFSK1200 link.
# Send a KISS frame to A's KISS port (8001) and it comes out of B's (8002).
nodes:
  - id: a
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002

links:
  - { from: a.vhf, to: b.vhf, path_loss_db: 120 }
  - { from: b.vhf, to: a.vhf, path_loss_db: 120 }
